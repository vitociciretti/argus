# Per-connector configuration. Section name == connector name.

# Shared watchlist: findings whose title/entities match any term get tagged,
# pulled into the report's "Watchlist hits" section, and bumped +1 importance.
# GDELT builds its news query from countries/commodities/terms when no
# explicit query is set below.
[watchlist]
tickers = []
countries = ["Iran", "Russia", "Taiwan", "China"]
commodities = ["crude oil", "natural gas", "uranium"]
terms = ["export controls", "sanctions", "tariffs", "Strait of Hormuz"]

[polymarket]
move_threshold = 0.05   # flag probability moves >= 5pp between scans
min_volume_24h = 10000  # ignore thin markets
limit = 100             # top markets by 24h volume

[gdelt]
# query = '("export controls" OR "new sanctions") sourcelang:english'  # overrides watchlist
timespan = "1d"
max_records = 40

[federal_register]
# defaults: SEC, CFTC, Treasury, Fed, OFAC — rules and proposed rules only
# agencies = ["securities-and-exchange-commission"]
# types = ["RULE", "PRORULE"]

[kalshi]
move_threshold = 0.05
min_volume_24h = 500      # contracts, not dollars
# exclude_categories = ["Sports", "Entertainment", "Social"]

[gpr]
spike_ratio = 1.4         # MA7/MA30 entering spike territory
level_alert = 250.0       # daily GPRD level

[epu]
spike_ratio = 2.0         # daily value vs its trailing 30d mean
level_alert = 500.0

[warn_tx]
min_layoffs = 50          # ignore small notices
big_layoff = 500          # importance 4 above this

[usaspending]
min_amount = 50e6
huge_amount = 250e6       # importance 4 above this
lookback_days = 7

[portwatch]
disruption_ratio = 0.7    # 7d/30d transits below this = disruption alert
surge_ratio = 1.4

[clinicaltrials]
# statuses = "TERMINATED|SUSPENDED|WITHDRAWN"

[courtlistener]
queries = ['"securities fraud"']
# api_token = ""          # free at courtlistener.com; raises rate limits

[edgar_ownership]
days = 2                  # how many recent business days of the daily index
# form4_companies = ["Tesla", "NVIDIA"]   # Form 4s only for named companies

[fca_shorts]
big_pct = 1.0             # importance 3 for new shorts at/above this
change_pp = 0.2           # flag position changes >= 0.2pp

[cftc_cot]
swing_pp = 0.05           # flag weekly net-spec swings >= 5pp of OI
# markets = ["GOLD", "CRUDE OIL", ...]  # substring match on market names

[nyfed_rrp]
low_alert_bn = 25.0
high_alert_bn = 400.0
move_alert_bn = 100.0

[treasury_tga]
low_alert_bn = 300.0
move_alert_bn = 75.0

[usgs_quakes]
min_magnitude = 6.0

[defillama]
min_tvl = 100e6
top = 100
move_pct = 0.20

[wiki_pageviews]
pages = ["Bank_run", "Recession", "Stock_market_crash", "Hyperinflation"]
spike_ratio = 3.0

[hn_mentions]
# terms = []              # defaults to [watchlist] terms
hot_points = 100

[crtsh]
# domains = ["yourcompany.com"]   # required — skipped until set
window_days = 30

[project]
name = "argus-osint"
version = "0.1.0"
description = "OSINT connectors for finance: the free data Bloomberg and OpenBB don't cover, normalized into records and delta-scanned into findings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vito Ciciretti" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "xlrd>=2.0",  # GPR daily index ships as .xls
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
